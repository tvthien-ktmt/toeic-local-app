<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Rounded gradient background matching header logo -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>

  <!-- BrainCircuit Icon in White -->
  <g stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" transform="translate(4, 4)">
    <!-- Left Hemisphere -->
    <path d="M12 4.5a2.5 2.5 0 0 0-4.9.1A3.2 3.2 0 0 0 5 9.8a3.2 3.2 0 0 0 .5 5.3A3.2 3.2 0 0 0 12 14.5Z"/>
    <!-- Right Hemisphere -->
    <path d="M12 4.5a2.5 2.5 0 0 1 4.9.1A3.2 3.2 0 0 1 19 9.8a3.2 3.2 0 0 1-.5 5.3A3.2 3.2 0 0 1 12 14.5Z"/>
    <!-- Central AI Circuit Connection Lines -->
    <path d="M12 7.5v4" stroke-dasharray="1 0.5"/>
    <path d="M9.5 9.5h5"/>
    <!-- Circuit Nodes -->
    <circle cx="12" cy="9.5" r="1.25" fill="#FFFFFF" stroke="none"/>
    <circle cx="8" cy="7.5" r="0.9" fill="#FFFFFF" stroke="none"/>
    <circle cx="16" cy="7.5" r="0.9" fill="#FFFFFF" stroke="none"/>
    <circle cx="8" cy="11.5" r="0.9" fill="#FFFFFF" stroke="none"/>
    <circle cx="16" cy="11.5" r="0.9" fill="#FFFFFF" stroke="none"/>
    <circle cx="12" cy="17" r="1" fill="#FFFFFF" stroke="none"/>
    <path d="M12 14.5v2.5"/>
  </g>
</svg>